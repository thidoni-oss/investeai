<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente IA - Investimentos Imobiliários</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <style>
    :root {
      --tdonizetti-green: #1D9E75;
      --tdonizetti-green-dark: #0F6E56;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #f0f4f8 100%);
    }
    
    .accent-btn {
      background-color: var(--tdonizetti-green);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    
    .accent-btn:hover {
      background-color: var(--tdonizetti-green-dark);
      transform: translateY(-1px);
    }
    
    .accent-btn:active {
      transform: translateY(0px);
    }
    
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--tdonizetti-green);
      box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.1);
    }
    
    .card {
      background: white;
      border-radius: 0.75rem;
      border: 1px solid #e0e0e0;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.2s;
    }
    
    .card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    
    .badge {
      display: inline-block;
      background-color: rgba(29, 158, 117, 0.1);
      color: var(--tdonizetti-green);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .badge-success {
      background-color: rgba(34, 197, 94, 0.1);
      color: #22c55e;
    }
    
    .badge-warning {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
    }
    
    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }
    
    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--tdonizetti-green);
      animation: bounce 1.4s infinite;
    }
    
    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(1); }
      40% { transform: scale(1.2); }
    }
    
    .recommendation-item {
      border-left: 4px solid var(--tdonizetti-green);
      padding-left: 1rem;
      margin-bottom: 1rem;
    }
    
    .link-text {
      color: var(--tdonizetti-green);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    
    .link-text:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const [stage, setStage] = useState('form');
      const [formData, setFormData] = useState({
        name: '',
        income: '',
        goal: '',
        riskProfile: 'moderate'
      });
      const [analysis, setAnalysis] = useState('');
      const [recommendations, setRecommendations] = useState([]);
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [leadSent, setLeadSent] = useState(false);
      const analysisRef = useRef(null);

      const handleFormChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const callClaudeAPI = async (userPrompt) => {
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': 'sk-ant-v1-PLACEHOLDER', // Será substituída no backend
              'anthropic-version': '2023-06-01',
            },
            body: JSON.stringify({
              model: 'claude-3-5-sonnet-20241022',
              max_tokens: 1500,
              messages: [
                {
                  role: 'user',
                  content: userPrompt
                }
              ]
            })
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
          }

          const data = await response.json();
          return data.content[0].text;
        } catch (error) {
          // Fallback para dados de exemplo (MVP)
          return generateMockAnalysis(formData);
        }
      };

      const generateMockAnalysis = (data) => {
        const income = parseFloat(data.income) || 5000;
        const goal = parseFloat(data.goal) || 100000;
        const months = Math.ceil(goal / (income * 0.20));

        return `## Análise do Seu Perfil de Investimento Imobiliário

**Perfil Identificado:** Investidor ${data.riskProfile === 'conservative' ? 'Conservador' : data.riskProfile === 'moderate' ? 'Moderado' : 'Agressivo'} com renda de R$ ${income.toLocaleString('pt-BR')}/mês

### Diagnóstico Principal
Com uma meta de R$ ${goal.toLocaleString('pt-BR')} e renda atual, você está em posição de iniciar ou expandir seu portfólio imobiliário. O horizonte estimado é de **${months} meses** com alocação disciplinada.

### Oportunidades Identificadas
1. **Consórcio de Imóvel** - Baixo risco, sem juros, ideal para seu perfil
2. **Financiamento Imobiliário** - Taxa SELIC em ${(10.5).toFixed(1)}%, refinanciamento possível
3. **Leilão Judicial** - Imóvel com desconto de 30-50%, requer capital inicial

### Recomendação Estratégica
Começar com consórcio (risco mínimo, construção de crédito), depois migrar para financiamento quando atingir 30% do valor da meta.`;
      };

      const handleAnalyze = async () => {
        if (!formData.name || !formData.income || !formData.goal) {
          alert('Por favor, preencha todos os campos');
          return;
        }

        setLoading(true);
        setStage('analyzing');
        setAnalysis('');
        setRecommendations([]);

        const prompt = `Você é um consultor de investimentos imobiliários experiente. Analise o seguinte perfil de investidor e forneça uma análise detalhada e recomendações estratégicas:

**Dados do Investidor:**
- Nome: ${formData.name}
- Renda Mensal: R$ ${parseFloat(formData.income).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
- Meta de Investimento: R$ ${parseFloat(formData.goal).toLocaleString('pt-BR')}
- Perfil de Risco: ${formData.riskProfile === 'conservative' ? 'Conservador' : formData.riskProfile === 'moderate' ? 'Moderado' : 'Agressivo'}

Forneça:
1. Uma análise clara do perfil e oportunidades (2-3 parágrafos)
2. 3-4 recomendações de produtos específicos (consórcio, financiamento, leilão, compra direta) com por quê
3. Próximos passos práticos

Use linguagem clara, didática e inspiradora. Inclua estimativas de prazo e ROI quando aplicável.`;

        const result = await callClaudeAPI(prompt);
        setAnalysis(result);

        // Parse recomendações (simplificado para MVP)
        const recs = [
          { title: 'Consórcio Imobiliário', description: 'Zero juros, sem dívida. Ideal para começar.' },
          { title: 'Financiamento Bancário', description: 'Taxa SELIC atual de 10.5%. Construir histórico de crédito.' },
          { title: 'Leilão Judicial', description: 'Imóvel com desconto. Requer capital inicial mas ROI elevado.' }
        ];
        setRecommendations(recs);

        setLoading(false);
        setStage('result');
      };

      const handleLeadCapture = async () => {
        if (!email || !email.includes('@')) {
          alert('Por favor, insira um email válido');
          return;
        }

        // Simular envio (será integrado com Supabase no backend)
        console.log('Lead capturado:', {
          name: formData.name,
          email,
          income: formData.income,
          goal: formData.goal,
          riskProfile: formData.riskProfile,
          timestamp: new Date().toISOString()
        });

        setLeadSent(true);
        setTimeout(() => {
          setStage('success');
        }, 1000);
      };

      const resetForm = () => {
        setStage('form');
        setFormData({ name: '', income: '', goal: '', riskProfile: 'moderate' });
        setAnalysis('');
        setRecommendations([]);
        setEmail('');
        setLeadSent(false);
      };

      return (
        <div className="min-h-screen py-8 px-4">
          <div className="max-w-2xl mx-auto">
            {/* Header */}
            <div className="text-center mb-8">
              <div style={{ color: 'var(--tdonizetti-green)' }} className="text-4xl font-bold mb-2">
                💰 RentaAI
              </div>
              <p className="text-gray-600 text-lg">Seu consultor de investimentos imobiliários com IA</p>
              <p className="text-gray-500 text-sm mt-2">Descubra qual é a melhor estratégia para sua meta financeira</p>
            </div>

            {/* Stage: Form */}
            {stage === 'form' && (
              <div className="card">
                <h2 className="text-2xl font-bold mb-6" style={{ color: 'var(--tdonizetti-green)' }}>
                  Vamos começar sua jornada
                </h2>
                
                <div className="space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Seu nome completo
                    </label>
                    <input
                      type="text"
                      name="name"
                      className="input-field"
                      placeholder="Ex: João Silva"
                      value={formData.name}
                      onChange={handleFormChange}
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Renda mensal (R$)
                    </label>
                    <input
                      type="number"
                      name="income"
                      className="input-field"
                      placeholder="Ex: 5000"
                      value={formData.income}
                      onChange={handleFormChange}
                    />
                    <p className="text-xs text-gray-500 mt-1">Renda líquida mensal (salário, faturamento, etc.)</p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Sua meta de investimento (R$)
                    </label>
                    <input
                      type="number"
                      name="goal"
                      className="input-field"
                      placeholder="Ex: 500000"
                      value={formData.goal}
                      onChange={handleFormChange}
                    />
                    <p className="text-xs text-gray-500 mt-1">Quanto você quer investir em imóvel/renda?</p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Seu perfil de risco
                    </label>
                    <select
                      name="riskProfile"
                      className="input-field"
                      value={formData.riskProfile}
                      onChange={handleFormChange}
                    >
                      <option value="conservative">🛡️ Conservador - Segurança em primeiro lugar</option>
                      <option value="moderate">⚖️ Moderado - Equilíbrio entre segurança e retorno</option>
                      <option value="aggressive">🚀 Agressivo - Busco máximo retorno</option>
                    </select>
                  </div>

                  <button
                    className="accent-btn w-full text-lg py-3 mt-6"
                    onClick={handleAnalyze}
                    disabled={loading}
                  >
                    {loading ? (
                      <div className="loading-dots">
                        <span></span><span></span><span></span>
                      </div>
                    ) : (
                      '✨ Analisar meu perfil'
                    )}
                  </button>
                </div>

                {/* Footer branding */}
                <div className="mt-8 pt-6 border-t border-gray-200 text-center">
                  <p className="text-sm text-gray-600 mb-3">Desenvolvido por</p>
                  <div className="flex justify-center gap-4 text-sm">
                    <a href="#" className="link-text">🌐 TDONIZETTI.com</a>
                    <span className="text-gray-300">•</span>
                    <a href="#" className="link-text">📱 Instagram</a>
                    <span className="text-gray-300">•</span>
                    <a href="#" className="link-text">💬 WhatsApp</a>
                  </div>
                </div>
              </div>
            )}

            {/* Stage: Analyzing */}
            {stage === 'analyzing' && (
              <div className="card text-center">
                <div className="loading-dots mb-4">
                  <span></span><span></span><span></span>
                </div>
                <p className="text-gray-600">Analisando seu perfil com IA...</p>
                <p className="text-sm text-gray-500 mt-2">Isso pode levar alguns segundos</p>
              </div>
            )}

            {/* Stage: Result */}
            {stage === 'result' && (
              <div>
                {/* Analysis */}
                <div className="card">
                  <h2 className="text-2xl font-bold mb-4" style={{ color: 'var(--tdonizetti-green)' }}>
                    ✅ Análise Completa
                  </h2>
                  <div ref={analysisRef} className="prose prose-sm max-w-none text-gray-700 mb-6">
                    {analysis.split('\n').map((line, idx) => {
                      if (line.startsWith('## ')) {
                        return <h3 key={idx} className="text-lg font-bold mt-4 mb-2">{line.replace('## ', '')}</h3>;
                      }
                      if (line.startsWith('### ')) {
                        return <h4 key={idx} className="text-md font-semibold mt-3 mb-2">{line.replace('### ', '')}</h4>;
                      }
                      if (line.startsWith('**') && line.endsWith('**')) {
                        return <p key={idx} className="font-semibold mt-2">{line.replace(/\*\*/g, '')}</p>;
                      }
                      if (line.startsWith('- ')) {
                        return <li key={idx} className="ml-4 mt-1">{line.substring(2)}</li>;
                      }
                      if (line.startsWith('1. ') || line.startsWith('2. ') || line.startsWith('3. ')) {
                        return <li key={idx} className="ml-4 mt-1">{line.substring(3)}</li>;
                      }
                      if (line.trim()) {
                        return <p key={idx} className="mt-2">{line}</p>;
                      }
                      return null;
                    })}
                  </div>
                </div>

                {/* Recommendations */}
                {recommendations.length > 0 && (
                  <div className="card">
                    <h3 className="text-xl font-bold mb-4" style={{ color: 'var(--tdonizetti-green)' }}>
                      🎯 Produtos Recomendados
                    </h3>
                    <div>
                      {recommendations.map((rec, idx) => (
                        <div key={idx} className="recommendation-item">
                          <h4 className="font-semibold text-gray-800">{rec.title}</h4>
                          <p className="text-sm text-gray-600 mt-1">{rec.description}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Lead Capture */}
                <div className="card">
                  <h3 className="text-xl font-bold mb-2">📧 Receba orientação personalizada</h3>
                  <p className="text-gray-600 text-sm mb-4">
                    Deixe seu email para receber um plano de ação detalhado. Nossos especialistas entramos em contato para detalhar as melhores oportunidades.
                  </p>
                  
                  <div className="space-y-3">
                    <input
                      type="email"
                      className="input-field"
                      placeholder="seu.email@example.com"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                    />
                    
                    <button
                      className="accent-btn w-full"
                      onClick={handleLeadCapture}
                      disabled={leadSent}
                    >
                      {leadSent ? '✓ Email enviado!' : 'Receber análise detalhada'}
                    </button>
                  </div>
                </div>

                {/* Actions */}
                <div className="flex gap-3 mt-6">
                  <button
                    className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition"
                    onClick={resetForm}
                  >
                    ← Nova análise
                  </button>
                </div>
              </div>
            )}

            {/* Stage: Success */}
            {stage === 'success' && (
              <div className="card text-center">
                <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>🎉</div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">Perfeito!</h2>
                <p className="text-gray-600 mb-6">
                  Sua análise foi enviada. Nossos especialistas entrarão em contato em até 24 horas para detalhar as melhores oportunidades para você.
                </p>
                
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                  <p className="text-sm text-blue-800">
                    <strong>💡 Dica:</strong> Enquanto isso, confira nossos recursos sobre investimento imobiliário no Instagram @tdonizetti
                  </p>
                </div>

                <button
                  className="accent-btn w-full"
                  onClick={resetForm}
                >
                  Analisar outro perfil
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
